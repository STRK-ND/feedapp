version: 2.1

# Flutter has no official CircleCI convenience image, so the SDK is
# git-cloned at a pinned version from flutter/flutter (first-party) and
# cached across builds. Keep FLUTTER_VERSION in sync in all three jobs.

commands:
  install_flutter:
    description: Install pinned Flutter SDK (cached across builds, SHA-verified)
    parameters:
      # Full commit SHA of the FLUTTER_VERSION tag. Supplied by release/verify
      # jobs for signed builds so the SDK that produces the artifact is bound
      # to an exact revision, not a movable tag.
      verify_commit:
        type: string
        default: ""
    steps:
      - restore_cache:
          keys:
            - flutter-sdk-{{ .Environment.FLUTTER_VERSION }}-v1
      - run:
          name: Install Flutter
          command: |
            if [ ! -x "$HOME/flutter-sdk/bin/flutter" ]; then
              git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$HOME/flutter-sdk"
            fi
            if [ -n "<< parameters.verify_commit >>" ]; then
              ACTUAL=$(git -C "$HOME/flutter-sdk" rev-parse HEAD)
              if [ "$ACTUAL" != "<< parameters.verify_commit >>" ]; then
                echo "Flutter SDK SHA mismatch: expected << parameters.verify_commit >>, got $ACTUAL" >&2
                exit 1
              fi
            fi
            "$HOME/flutter-sdk/bin/flutter" --version
            echo "export PATH=\"$HOME/flutter-sdk/bin:$PATH\"" >> "$BASH_ENV"
      - save_cache:
          key: flutter-sdk-{{ .Environment.FLUTTER_VERSION }}-v1
          paths:
            - ~/flutter-sdk

  restore_pub_cache:
    description: Restore pub cache keyed on pubspec.lock
    steps:
      - restore_cache:
          keys:
            - pub-v1-{{ checksum "pubspec.lock" }}

  save_pub_cache:
    description: Save pub cache keyed on pubspec.lock
    steps:
      - save_cache:
          key: pub-v1-{{ checksum "pubspec.lock" }}
          paths:
            - ~/.pub-cache

  restore_gradle_cache:
    description: Restore Gradle wrapper + dependency caches
    steps:
      - restore_cache:
          keys:
            - gradle-v1-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}

  save_gradle_cache:
    description: Save Gradle wrapper + dependency caches
    steps:
      - save_cache:
          key: gradle-v1-{{ checksum "android/gradle/wrapper/gradle-wrapper.properties" }}
          paths:
            - ~/.gradle/wrapper
            - ~/.gradle/caches/modules-2

  decode_signing:
    description: Restore upload keystore + Firebase config from env vars
    steps:
      - run:
          name: Decode upload keystore
          command: |
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            # NB: no heredoc here — that sequence is reserved in CircleCI
            # configs (YAML merge key) and breaks compilation.
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
      - run:
          name: Write google-services.json
          command: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

jobs:
  # Mirrors .github ci.yml — format gate, analyze, unit tests.
  verify:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      FLUTTER_VERSION: "3.47.2"
    steps:
      - checkout
      - install_flutter
      - run:
          name: Check formatting
          command: dart format --output=none --set-exit-if-changed lib test
      - run:
          name: Analyze
          command: flutter analyze
      - run:
          name: Unit tests
          command: flutter test

  # Mirrors .github build.yml — signed APK + AAB on every master push.
  # FLUTTER_COMMIT (full SHA of the FLUTTER_VERSION tag) must be provided via
  # project env vars: signed builds fail closed without it so the SDK that
  # produces the artifact is always pinned.
  build_signed:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      FLUTTER_VERSION: "3.47.2"
    steps:
      - run:
          name: Require pinned SDK commit
          command: |
            if [ -z "${FLUTTER_COMMIT:-}" ]; then
              echo "FLUTTER_COMMIT is not set: add the full commit SHA of Flutter $FLUTTER_VERSION to project env vars before running signed builds." >&2
              exit 1
            fi
      - checkout
      - install_flutter:
          verify_commit: "${FLUTTER_COMMIT}"
      - decode_signing
      - restore_pub_cache
      - restore_gradle_cache
      - run:
          name: Pub get
          command: flutter pub get
      - save_pub_cache
      - run:
          name: Build signed APK (direct channel)
          command: flutter build apk --release --flavor direct --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET"
      - run:
          name: Build signed AAB (direct channel)
          command: flutter build appbundle --release --flavor direct --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET"
      - run:
          name: Build Play AAB (play channel)
          command: flutter build appbundle --release --flavor play --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET" --dart-define="PLAY_STORE_BUILD=true"
      - save_gradle_cache
      - store_artifacts:
          path: build/app/outputs/flutter-apk/release/app-release.apk
          destination: app-release.apk
      - store_artifacts:
          path: build/app/outputs/bundle/release/app-release.aab
          destination: app-release.aab
      - store_artifacts:
          path: build/app/outputs/bundle/playRelease/app-release.aab
          destination: app-play-release.aab

  # Provenance gate for the release workflow: the v* tag must point at a
  # commit on master (the reviewed code), not an arbitrary commit. Runs
  # before the approval hold and before any signing material is decoded.
  release_provenance_check:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - run:
          name: Verify tag points at master
          command: |
            git fetch origin master --quiet
            TAG_COMMIT=$(git rev-parse "${CIRCLE_TAG}^{commit}")
            # The command is an if-condition so set -e cannot abort before
            # the explanatory error is printed.
            if git merge-base --is-ancestor "$TAG_COMMIT" origin/master; then
              MASTER_HEAD=$(git rev-parse origin/master)
              if [ "$TAG_COMMIT" != "$MASTER_HEAD" ]; then
                echo "WARNING: tag $CIRCLE_TAG is on master history but not at master HEAD ($MASTER_HEAD)."
              fi
              echo "Provenance OK: tag $CIRCLE_TAG is an ancestor of origin/master."
            else
              echo "Tag $CIRCLE_TAG ($TAG_COMMIT) is NOT on master - refusing to release off-master code." >&2
              exit 1
            fi

  # Mirrors .github release.yml — on a v* tag: provenance check, approval,
  # version sync, checks, signed APK + AAB + SHA256SUMS, publish a GitHub
  # Release. The in-app updater reads that release, so hosting stays on
  # GitHub regardless of who builds.
  release:
    docker:
      - image: cimg/android:2026.08.1
    environment:
      FLUTTER_VERSION: "3.47.2"
    steps:
      - run:
          name: Require pinned SDK commit
          command: |
            if [ -z "${FLUTTER_COMMIT:-}" ]; then
              echo "FLUTTER_COMMIT is not set: add the full commit SHA of Flutter $FLUTTER_VERSION to project env vars before releasing." >&2
              exit 1
            fi
      - checkout
      - install_flutter:
          verify_commit: "${FLUTTER_COMMIT}"
      - decode_signing
      - restore_pub_cache
      - restore_gradle_cache
      - run:
          name: Sync pubspec version with tag
          command: |
            VERSION="${CIRCLE_TAG#v}"
            # versionCode must exceed any prior upload: the sideload line ended
            # at 1.0.2+25 and 1.0.0+26 is the Play baseline, so early CI build
            # numbers are floored at 26 and can never under-rank sideloads.
            MIN_CODE=26
            CODE=$((22 + CIRCLE_BUILD_NUM))
            if [ "$CODE" -lt "$MIN_CODE" ]; then
              CODE=$MIN_CODE
            fi
            # The tag must not drift from the reviewed pubspec version: a tag
            # without a matching pubspec bump fails the release here.
            PUBSPEC_VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\)+.*/\1/p' pubspec.yaml)
            if [ "$VERSION" != "$PUBSPEC_VERSION" ]; then
              echo "Tag v$VERSION does not match pubspec version $PUBSPEC_VERSION - bump pubspec and tag the release commit." >&2
              exit 1
            fi
            sed -i "s/^version: .*/version: $VERSION+$CODE/" pubspec.yaml
            echo "Synced pubspec version to $VERSION+$CODE"
      - run: flutter pub get
      - save_pub_cache
      - run: flutter analyze
      - run: flutter test
      - run:
          name: Build signed APK (direct channel)
          command: flutter build apk --release --flavor direct --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET"
      - run:
          name: Build signed AAB (direct channel)
          command: flutter build appbundle --release --flavor direct --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET"
      - run:
          name: Build Play AAB (play channel)
          command: flutter build appbundle --release --flavor play --dart-define="WORKER_API_SECRET=$WORKER_API_SECRET" --dart-define="PLAY_STORE_BUILD=true"
      - save_gradle_cache
      - run:
          name: Write SHA256SUMS
          command: |
            cd build/app/outputs
            ( cd flutter-apk/release && sha256sum app-release.apk ) >> SHA256SUMS
            ( cd bundle/release && sha256sum app-release.aab ) >> SHA256SUMS
            ( cd bundle/playRelease && sha256sum app-release.aab ) >> SHA256SUMS
            cat SHA256SUMS
      - run:
          name: Publish GitHub Release
          command: |
            TAG="$CIRCLE_TAG"
            mv build/app/outputs/flutter-apk/release/app-release.apk "curated-feeds-$TAG.apk"
            mv build/app/outputs/bundle/release/app-release.aab "curated-feeds-$TAG.aab"
            mv build/app/outputs/bundle/playRelease/app-release.aab "curated-feeds-$TAG-play.aab"
            cp build/app/outputs/SHA256SUMS "SHA256SUMS-$TAG.txt"

            REPO="STRK-ND/feedapp"
            AUTH=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
            HTTP_CODE=$(curl -sS -o /tmp/rel.json -w "%{http_code}" "${AUTH[@]}" \
              "https://api.github.com/repos/$REPO/releases/tags/$TAG")
            if [ "$HTTP_CODE" = "200" ]; then
              echo "Release $TAG already exists — uploading assets to it"
            elif [ "$HTTP_CODE" = "404" ]; then
              curl -sS -o /tmp/rel.json -X POST "${AUTH[@]}" \
                "https://api.github.com/repos/$REPO/releases" \
                -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"generate_release_notes\":true}"
            else
              echo "Unexpected response checking release: $HTTP_CODE"; cat /tmp/rel.json; exit 1
            fi
            UPLOAD_URL=$(python3 -c 'import json; print(json.load(open("/tmp/rel.json"))["upload_url"].split("{")[0])')

            upload_asset() {
              local file="$1" mime="$2"
              HTTP_CODE=$(curl -sS -o /tmp/asset.json -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Content-Type: $mime" \
                --data-binary @"$file" \
                "$UPLOAD_URL?name=$file")
              if [ "$HTTP_CODE" != "201" ]; then
                echo "Asset upload failed ($HTTP_CODE): $(head -c 300 /tmp/asset.json)"; exit 1
              fi
            }
            upload_asset "curated-feeds-$TAG.apk" "application/vnd.android.package-archive"
            upload_asset "curated-feeds-$TAG.aab" "application/octet-stream"
            upload_asset "SHA256SUMS-$TAG.txt" "text/plain"
            echo "Published release $TAG with APK + AAB + SHA256SUMS (play AAB kept as artifact for manual store upload)"

workflows:
  ci:
    jobs:
      - verify
      - build_signed:
          requires:
            - verify
          filters:
            branches:
              only: master
  release:
    jobs:
      # Provenance gate: the tag must point at the reviewed master HEAD
      # before any signing material is decoded. Blocks the job (and the
      # hold that follows) when the tag is off-master.
      - release_provenance_check:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - hold:
          type: approval
          requires:
            - release_provenance_check
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - release:
          requires:
            - hold
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
