version: 2.1

# =============================================================================
# CircleCI Config for Curated Feeds (Flutter)
# =============================================================================
# All CI/CD handled exclusively by CircleCI — no GitHub Actions.
#
# How it works:
#   - Every push to any branch          → runs test-all workflow
#   - Every pull request               → runs test-all workflow (automatic)
#   - Every git tag matching v*.*.*    → runs release workflow
# =============================================================================

executors:
  flutter-executor:
    docker:
      - image: cimg/flutter:3.41.1
        environment:
          FLUTTER_ENV: CI
          FLUTTER_VERSION: "3.41.1"
    working_directory: ~/project

  ios-executor:
    macos:
      xcode: "16.0"
    working_directory: ~/project

orbs:
  flutter: circlesaucers/flutter@2.0.2

# =============================================================================
# Commands — reusable step sequences
# =============================================================================
commands:
  install-gh-cli:
    steps:
      - run:
          name: Install GitHub CLI
          command: |
            if command -v gh &>/dev/null; then
              echo "gh already installed: $(gh --version)"
            else
              brew install gh
              gh auth status || gh auth login --hostname github.com
            fi

  install-shorebird:
    steps:
      - run:
          name: Install Shorebird CLI
          command: |
            if command -v shorebird &>/dev/null; then
              echo "shorebird already installed: $(shorebird --version)"
            else
              dart pub global activate shorebird
            fi
            export PATH="$PATH":"$HOME/.pub-cache/bin"
            echo 'export PATH="$PATH":"$HOME/.pub-cache/bin"' >> $BASH_ENV

# =============================================================================
# Jobs
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Lint — fast feedback, no waiting for tests
  # ---------------------------------------------------------------------------
  lint:
    executor: flutter-executor
    steps:
      - checkout
      - flutter/pubsub-cache:
          cache_version: "v2"
      - run:
          name: Get dependencies
          command: flutter pub get
      - run:
          name: Analyze code
          command: flutter analyze --no-fatal-infos

  # ---------------------------------------------------------------------------
  # Test — runs all unit tests
  # ---------------------------------------------------------------------------
  test:
    executor: flutter-executor
    steps:
      - checkout
      - flutter/pubsub-cache:
          cache_version: "v2"
      - run:
          name: Get dependencies
          command: flutter pub get
      - run:
          name: Run tests
          command: |
            mkdir -p test-results
            flutter test --machine > test-results/flutter-tests.xml
      - store_test_results:
          path: test-results

  # ---------------------------------------------------------------------------
  # Build Android Debug APK
  # ---------------------------------------------------------------------------
  build-android-preview:
    executor: flutter-executor
    steps:
      - checkout
      - flutter/pubsub-cache:
          cache_version: "v2"
      - run:
          name: Get dependencies
          command: flutter pub get
      - run:
          name: Build Android debug APK
          command: |
            flutter build apk --debug
            ls -la build/app/outputs/flutter-apk/
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-debug.apk
          destination: apks/

  # ---------------------------------------------------------------------------
  # Build iOS — simulator build, no App Store signing
  # ---------------------------------------------------------------------------
  build-ios:
    executor: ios-executor
    steps:
      - checkout
      - run:
          name: Get dependencies
          command: flutter pub get
      - run:
          name: Precache iOS toolchain
          command: flutter precache --ios
      - run:
          name: Build iOS simulator app
          command: |
            flutter build ios --simulator --no-codesign
            ls -la build/ios/iphonesimulator/
      - store_artifacts:
          path: build/ios/iphonesimulator/
          destination: ios-build/

  # ---------------------------------------------------------------------------
  # Build Release — Android APK + Shorebird + GitHub Release
  # ---------------------------------------------------------------------------
  build-release:
    executor: flutter-executor
    environment:
      FLUTTER_ENV: production
    steps:
      - checkout:
          fetch-depth: 0

      - flutter/pubsub-cache:
          cache_version: "v2"

      - install-gh-cli
      - install-shorebird

      - run:
          name: Get dependencies
          command: flutter pub get

      - run:
          name: Build Android release APK
          command: |
            flutter build apk --release
            ls -la build/app/outputs/flutter-apk/

      - run:
          name: Publish to Shorebird
          command: |
            set -e
            shorebird login --token ${SHOREBIRD_TOKEN}
            shorebird release android \
              --build-number ${CIRCLE_BUILD_NUM} \
              --artifact build/app/outputs/flutter-apk/app-release.apk

      - run:
          name: Create GitHub Release
          command: |
            set -e
            VERSION=${CIRCLE_TAG#v}
            gh release create "v${VERSION}" \
              build/app/outputs/flutter-apk/app-release.apk \
              --title "Curated Feeds v${VERSION}" \
              --generate-notes \
              --target ${CIRCLE_SHA1}

      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: release/

  # ---------------------------------------------------------------------------
  # Validate secrets — fail fast if SHOREBIRD_TOKEN is missing
  # ---------------------------------------------------------------------------
  validate-secrets:
    executor: flutter-executor
    steps:
      - run:
          name: Validate required secrets
          command: |
            echo "Checking required secrets..."
            ERRORS=0
            if [ -z "${SHOREBIRD_TOKEN}" ]; then
              echo "ERROR: SHOREBIRD_TOKEN is not set in context 'release-secrets'"
              echo "  → Get it: shorebird login && shorebird token"
              echo "  → Add in CircleCI: Project Settings → Contexts → release-secrets"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: SHOREBIRD_TOKEN is set"
            fi
            if [ $ERRORS -gt 0 ]; then
              echo "Setup incomplete. Fix the errors above."
              exit 1
            fi
            echo "All secrets validated."

# =============================================================================
# Workflows
# =============================================================================
workflows:
  # ---------------------------------------------------------------------------
  # test-all — runs on every push and pull request (automatic)
  # Skips jobs on gh-pages to avoid CI noise for docs-only branches
  # ---------------------------------------------------------------------------
  test-all:
    jobs:
      - lint:
          filters:
            branches:
              ignore:
                - gh-pages
      - test:
          filters:
            branches:
              ignore:
                - gh-pages
      - build-android-preview:
          filters:
            branches:
              ignore:
                - gh-pages
      - build-ios:
          filters:
            branches:
              ignore:
                - gh-pages

  # ---------------------------------------------------------------------------
  # release — runs only on version tags (v1.0.0, v1.2.3, etc.)
  # Validates secrets first, then runs tests, then builds and publishes
  # ---------------------------------------------------------------------------
  release:
    jobs:
      - validate-secrets:
          context:
            - release-secrets
          filters:
            tags:
              only: /v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
      - test:
          context:
            - release-secrets
          filters:
            tags:
              only: /v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
          requires:
            - validate-secrets
      - build-release:
          context:
            - release-secrets
          filters:
            tags:
              only: /v[0-9]+\.[0-9]+\.[0-9]+.*/
            branches:
              ignore: /.*/
          requires:
            - test