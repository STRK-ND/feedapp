version: 2.1

# Execute jobs on Ubuntu 24.04
executors:
  android-executor:
    docker:
      - image: cimg/android:2024.01
    resource_class: medium
    working_directory: ~/project

jobs:
  build_android:
    executor: android-executor
    steps:
      # Checkout code
      - checkout

      # Configure Git (required for changelog extraction)
      - run:
          name: Configure Git
          command: |
            git config --global user.email "circleci@feedapp.com"
            git config --global user.name "CircleCI"
            git config --global --add safe.directory /home/circleci/project

      # Install Java 21
      - run:
          name: Install Java 21
          command: |
            sudo apt-get update
            sudo apt-get install -y openjdk-21-jdk

      # Install Flutter
      - run:
          name: Install Flutter 3.41.1
          command: |
            cd /home/circleci
            curl -o flutter_sdk.zip -L https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.1-stable.tar.xz
            tar xf flutter_sdk.zip
            echo 'export PATH="$PATH:/home/circleci/flutter/bin"' >> $BASH_ENV
            source $BASH_ENV
            flutter --version

      # Restore cached pub dependencies
      - restore_cache:
          keys:
            - pub-cache-v1-{{ checksum "pubspec.lock" }}
            - pub-cache-v1-

      # Install dependencies
      - run:
          name: Install dependencies
          command: flutter pub get

      # Cache pub dependencies
      - save_cache:
          paths:
            - ~/.pub-cache
          key: pub-cache-v1-{{ checksum "pubspec.lock" }}

      # Build APK
      - run:
          name: Build APK (Release)
          command: flutter build apk --release

      # Verify APK was created
      - run:
          name: Verify APK
          command: |
            if [ ! -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
              echo "❌ APK file not found at build/app/outputs/flutter-apk/app-release.apk"
              exit 1
            fi

            APK_SIZE=$(stat -c%s "build/app/outputs/flutter-apk/app-release.apk")
            echo "✅ APK built successfully (${APK_SIZE} bytes)"
            echo "export APK_PATH=\"build/app/outputs/flutter-apk/app-release.apk\"" >> $BASH_ENV

      # Extract version from tag
      - run:
          name: Extract version from tag
          command: |
            TAG=$(git describe --tags --exact-match 2>/dev/null || echo "")

            if [ -z "$TAG" ]; then
              TAG=${CIRCLE_TAG:-"v0.0.0"}
              echo "⚠️ No git tag found, using CIRCLE_TAG: $TAG"
            fi

            VERSION=${TAG#v}
            echo "export VERSION=\"$VERSION\"" >> $BASH_ENV
            echo "export TAG=\"$TAG\"" >> $BASH_ENV
            echo "✅ Version: $VERSION"

      # Generate changelog
      - run:
          name: Extract changelog
          command: |
            if [ -f "CHANGELOG.md" ]; then
              # Extract changelog section for the current version
              VERSION_NO_V=${VERSION#v}
              awk '/^## '${VERSION_NO_V}'/{flag=1; next} /^## [0-9]/{if(flag)exit} flag' CHANGELOG.md > ./changelog.txt

              if [ -s ./changelog.txt ]; then
                echo "✅ Changelog extracted for version ${VERSION_NO_V}"
              else
                echo "⚠️ No changelog found for ${VERSION_NO_V}"
                echo "Release version ${VERSION_NO_V}" > ./changelog.txt
              fi
            else
              echo "⚠️ CHANGELOG.md not found"
              echo "Release version ${VERSION}" > ./changelog.txt
            fi

            cat ./changelog.txt
            echo "export CHANGELOG_PATH=\"./changelog.txt\"" >> $BASH_ENV

      # Store APK as artifact (temporary storage)
      - persist_to_workspace:
          root: .
          paths:
            - build/app/outputs/flutter-apk/app-release.apk
            - changelog.txt

  create_release:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      # Attach workspace
      - attach_workspace:
          at: /tmp/workspace

      # Set environment variables
      - run:
          name: Setup environment
          command: |
            echo "export VERSION=\"${CIRCLE_TAG#v}\"" >> $BASH_ENV
            echo "export TAG=\"${CIRCLE_TAG}\"" >> $BASH_ENV

      # Verify files
      - run:
          name: Verify build artifacts
          command: |
            echo "Checking for APK file..."
            ls -la "/tmp/workspace/build/app/outputs/flutter-apk/app-release.apk"

            echo "Checking for changelog..."
            ls -la "/tmp/workspace/changelog.txt"

      # Create GitHub release using gh CLI
      - run:
          name: Create GitHub Release
          command: |
            if [ -z "$GITHUB_TOKEN" ]; then
              echo "❌ GITHUB_TOKEN not set. Cannot create release."
              echo "Please add GITHUB_TOKEN environment variable in CircleCI project settings."
              exit 1
            fi

            VERSION=${CIRCLE_TAG#v}
            echo "Exporting VERSION=$VERSION"

            # Create release
            gh release create "$CIRCLE_TAG" \
              --repo "$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME" \
              --title "Curated Feeds v${VERSION}" \
              --notes-file "/tmp/workspace/changelog.txt" \
              "/tmp/workspace/build/app/outputs/flutter-apk/app-release.apk"

            echo "✅ Release $CIRCLE_TAG created successfully"

workflows:
  version: 2

  # Build and release workflow (runs on version tags)
  build_and_release:
    jobs:
      - build_android:
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+.*/
            branches:
              ignore: /.*/
          context: feedapp-build

      - create_release:
          requires:
            - build_android
          filters:
            tags:
              only: /^v\d+\.\d+\.\d+.*/
            branches:
              ignore: /.*/
          context: feedapp-build

  # Manually triggered workflow
  manual_build:
    jobs:
      - build_android:
          filters:
            branches:
              only: /.*/

# Custom commands
commands:
  send_failure_notification:
    description: Send Slack notification on failure
    parameters:
      webhook_url:
        type: string
        default: ${SLACK_WEBHOOK_URL}
    steps:
      - run:
          name: Send failure notification
          command: |
            if [ ! -z "<< parameters.webhook_url >>" ]; then
              curl -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"Build failed: $CIRCLE_PROJECT_REPONAME - $CIRCLE_JOB\",\"username\":\"CircleCI\"}" \
                "<< parameters.webhook_url >>"
            fi
          when: on_fail
