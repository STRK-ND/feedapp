version: 2.1

orbs:
  android: circleci/android@3.0.1

executors:
  flutter:
    docker:
      - image: ghcr.io/cirruslabs/flutter:stable
    resource_class: medium
    environment:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64

jobs:
  analyze-and-test:
    executor: flutter
    steps:
      - checkout
      - run:
          name: flutter pub get
          command: flutter pub get
      - run:
          name: dart format check
          command: dart format --output=none --set-exit-if-changed lib test
      - run:
          name: dart pub audit
          command: dart pub audit || true  # known/transitive — resolve in a dedicated pass
      - run:
          name: flutter analyze
          command: flutter analyze
      - run:
          name: flutter test
          command: flutter test --reporter expanded

  worker:
    docker:
      - image: cimg/node:20.15-browsers
    steps:
      - checkout
      - run:
          name: Worker syntax check
          command: node --check workers/feed-worker.js
      - run:
          name: Worker tests
          command: cd workers && npm test

  build-release:
    executor: flutter
    resource_class: large
    steps:
      - checkout
      - run:
          name: Decode upload keystore
          command: |
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
      - run:
          name: Write key.properties
          command: |
            printf '%s\n' \
              "storePassword=$KEYSTORE_PASSWORD" \
              "keyPassword=$KEY_PASSWORD" \
              "keyAlias=$KEY_ALIAS" \
              "storeFile=upload-keystore.jks" \
              > android/key.properties
      - run:
          name: Write google-services.json
          command: |
            echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
      - run:
          name: flutter pub get
          command: flutter pub get
      - run:
          name: Build release APK
          command: flutter build apk --release
      - run:
          name: Build release AAB
          command: flutter build appbundle --release
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-release.apk
          destination: app-release.apk
      - store_artifacts:
          path: build/app/outputs/bundle/release/app-release.aab
          destination: app-release.aab

workflows:
  main:
    jobs:
      - analyze-and-test:
          filters:
            tags:
              only: /.*/
      - worker:
          filters:
            tags:
              only: /.*/
      - build-release:
          requires:
            - analyze-and-test
          filters:
            branches:
              only: master
