name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Tag-triggered GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks

      - name: Write key.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync pubspec version with tag
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          # versionCode must exceed any prior Play upload (local baseline is 22).
          # Floor the per-run counter at 22 so CI tag releases never regress below it.
          CODE=$((22 + GITHUB_RUN_NUMBER))
          sed -i "s/^version: .*/version: $VERSION+$CODE/" pubspec.yaml
          echo "Synced pubspec version to $VERSION+$CODE"

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: flutter build apk --release --dart-define=WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}

      - name: Build AAB
        run: flutter build appbundle --release --dart-define=WORKER_API_SECRET=${{ secrets.WORKER_API_SECRET }}

      - name: Rename artifacts
        run: |
          TAG="${{ github.ref_name }}"
          mv build/app/outputs/flutter-apk/app-release.apk "curated-feeds-$TAG.apk"
          mv build/app/outputs/bundle/release/app-release.aab "curated-feeds-$TAG.aab"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            curated-feeds-${{ github.ref_name }}.apk
            curated-feeds-${{ github.ref_name }}.aab
