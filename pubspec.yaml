name: curatedfeeds
description: "Curated Feeds — Your personalized RSS feed reader with smart content curation. Android only."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number
# is used as versionCode. Read more about Android versioning at
# https://developer.android.com/studio/publish/versioning
version: 1.0.1+27

environment:
  sdk: ^3.10.8

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # In-App Purchase
  in_app_purchase: ^3.2.0

  # Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: 10.3.1
  flutter_cache_manager: ^3.3.1
  sqflite: ^2.4.2

  # Networking & Data
  http: ^1.2.0
  crypto: ^3.0.7
  cached_network_image: ^3.3.0
  xml: ^7.0.1
  html: ^0.15.4

  # UI & Navigation
  url_launcher: ^6.2.0
  share_plus: ^13.2.0
  google_fonts: ^8.0.1

  # Connectivity & System
  connectivity_plus: ^7.0.0
  package_info_plus: ^10.2.0
  path_provider: ^2.1.4
  permission_handler: 12.0.3
  open_filex: ^4.7.0
  workmanager: ^0.10.9

  # State Management & DI
  get_it: ^9.2.1
  provider: ^6.1.2

  # Firebase
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  firebase_messaging: ^16.4.1

  # Error Tracking
  sentry_flutter: 9.28.0

  # Notifications
  flutter_local_notifications: ^22.0.1
  file_picker: ^12.0.0-beta.1

  # Listen mode (text-to-speech)
  flutter_tts: ^4.2.5
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  google_sign_in: ^7.2.0
  firebase_crashlytics: ^5.3.0
  posthog_flutter: ^5.38.1

  # In-app review prompt (R-4) — first-party Google package.
  in_app_review: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Regenerates the Android adaptive launcher icon from assets/brand/.
  # Run `python3 tool/generate_brand_assets.py` first, then this.
  flutter_launcher_icons: ^0.14.4

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  in_app_purchase_platform_interface: ^1.4.1
  sqflite_common_ffi: ^2.4.0+3


flutter:
  uses-material-design: true
  generate: true
  assets:
    - shorebird.yaml
    # Only logo.png is bundled: mark.png and mark_mono.png are inputs to
    # `dart run flutter_launcher_icons` (read from disk, never via
    # Image.asset), so listing them here would ship ~123 KB of dead weight
    # in every APK/AAB.
    - assets/brand/logo.png

# Regenerate with: python3 tool/generate_brand_assets.py, then
# `dart run flutter_launcher_icons`, then copy
# android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml over
# ic_launcher_round.xml (the tool only ever writes the former — the round
# variant would otherwise silently keep the old icon).
#
# The foreground and monochrome layers are ALREADY padded to the 66dp safe
# zone of the 108dp canvas by the Python script, which is why the inset is 0.
# The tool's default of 16 emits <inset android:inset="16%"/> and would
# shrink a correctly-sized 66dp mark to 45dp — visibly small in the launcher.
flutter_launcher_icons:
  android: true
  # Full tile (navy squircle + swirl + glyph) for the legacy rasters, which are
  # what Google Play renders in the store listing on API 26+.
  image_path_android: "assets/brand/logo.png"
  # Flat brand navy — AppColors.ground. Must be a hex string, not a path:
  # a hex string makes the tool write <color name="ic_launcher_background">
  # into res/values/colors.xml, which is the background layer we want.
  adaptive_icon_background: "#0E0814"
  # Swirl + glyph alone. The navy squircle is the background layer; putting
  # the whole tile here would render as an icon-inside-an-icon.
  adaptive_icon_foreground: "assets/brand/mark.png"
  adaptive_icon_foreground_inset: 0
  # White RSS-glyph silhouette. The swirl cannot be a themed icon: it is a
  # tonal gradient, so its alpha matte is ~64% coverage and renders as a
  # solid disc at 48dp.
  adaptive_icon_monochrome: "assets/brand/mark_mono.png"
  min_sdk_android: 24


